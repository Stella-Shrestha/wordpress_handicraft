<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Perfect Circular Text Path -->
    <path id="circlePath" d="M 100,100 m -72,0 a 72,72 0 1,1 144,0 a 72,72 0 1,1 -144,0" />
  </defs>

  <!-- Outer Ring Background & Double Terracotta Borders -->
  <circle cx="100" cy="100" r="96" fill="#FAF7F2" stroke="#B86B4B" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#B86B4B" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle cx="100" cy="100" r="58" fill="none" stroke="#B86B4B" stroke-width="2" />

  <!-- 360-Degree Curved Circular Border Text -->
  <text font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#B86B4B" letter-spacing="2.8">
    <textPath xlink:href="#circlePath" href="#circlePath" startOffset="0%">
      OFFICIALLY REGISTERED ★ NEPAL ★ VERIFIED ★
    </textPath>
  </text>

  <!-- Center Twin Mountain Line Art -->
  <g transform="translate(58, 76) scale(0.85)">
    <path d="M5,40 L25,10 L40,26 L60,5 L85,40" fill="none" stroke="#B86B4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25,10 L30,40" fill="none" stroke="#B86B4B" stroke-width="1.5" opacity="0.6" />
    <path d="M60,5 L52,40" fill="none" stroke="#B86B4B" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Center Typography -->
  <text x="100" y="68" text-anchor="middle" font-family="'Cinzel', serif" font-style="italic" font-size="13" font-weight="700" fill="#B86B4B">
    Verified
  </text>
  <text x="100" y="145" text-anchor="middle" font-family="'Cinzel', serif" font-style="italic" font-size="11" font-weight="600" fill="#B86B4B">
    Patan Atelier
  </text>
</svg>
